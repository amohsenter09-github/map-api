<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <p class="kicker">Map API</p>
      <h1>Find a place</h1>
    </header>
    <form id="form">
      <label>
        City
        <input id="city" type="text" placeholder="Berlin" value="Berlin" autocomplete="off" />
      </label>
      <div class="row">
        <label>
          Latitude
          <input id="latitude" type="number" step="any" placeholder="52.52" />
        </label>
        <label>
          Longitude
          <input id="longitude" type="number" step="any" placeholder="13.41" />
        </label>
      </div>
      <button type="submit">Show on map</button>
      <button id="save" type="button" class="secondary">Save pin</button>
      <button id="locate" type="button" class="secondary">Use my location</button>
    </form>
    <p id="status" class="status" hidden></p>
    <section id="result" hidden>
      <p id="place" class="place"></p>
      <div id="map"></div>
    </section>
    <section class="activity-panel">
      <h2>Live activity</h2>
      <div class="row">
        <label>
          Kind
          <select id="activity-kind">
            <option value="walk">Walk</option>
            <option value="run">Run</option>
            <option value="bike">Bike</option>
            <option value="commute">Commute</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>
          Label
          <input id="activity-label" type="text" placeholder="Evening walk" maxlength="200" />
        </label>
      </div>
      <button id="activity-toggle" type="button">Start activity</button>
      <div id="live-chips" class="chips" hidden></div>
      <p id="activity-hint" class="meta">On a phone, allow location. On a laptop, click the map to move the trail.</p>
    </section>
    <section id="pins-wrap">
      <h2>Saved pins</h2>
      <ul id="pins" class="pin-list"></ul>
    </section>
    <section>
      <h2>Activities</h2>
      <ul id="activities" class="pin-list"></ul>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
