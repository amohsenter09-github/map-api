services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: map
      POSTGRES_DB: map
    ports:
      - "5433:5432"
    volumes:
      - map-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d map"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://map:map@postgres:5432/map
    env_file:
      - path: .env
        required: false
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  map-pgdata:
